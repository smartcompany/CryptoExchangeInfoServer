<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exora · Push dashboard</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222c;
        --line: #2a3542;
        --ink: #e8eef4;
        --muted: #8b9aab;
        --accent: #3dd68c;
        --danger: #ff6b6b;
        --warn: #f0c14a;
        --info: #6cb6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
        min-height: 100vh;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 22px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }
      button {
        appearance: none;
        border: 1px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 32%, transparent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.secondary {
        border-color: var(--line);
        background: var(--panel);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.ok {
        background: var(--accent);
      }
      .dot.bad {
        background: var(--danger);
      }
      .dot.warn {
        background: var(--warn);
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      section h2 {
        margin: 0 0 10px;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.78rem;
        color: var(--ink);
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 8px;
        margin-bottom: 4px;
      }
      .meta div {
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .meta .k {
        color: var(--muted);
        font-size: 0.68rem;
      }
      .meta .v {
        font-size: 0.9rem;
        margin-top: 2px;
      }
      .err {
        color: var(--danger);
      }
      .explain {
        background: var(--bg);
        border-left: 3px solid var(--warn);
        padding: 10px 12px;
        font-size: 0.8rem;
        color: var(--ink);
        margin-bottom: 10px;
        border-radius: 0 8px 8px 0;
      }
      .log-view {
        max-height: 420px;
        overflow: auto;
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.72rem;
      }
      .log-line {
        display: grid;
        grid-template-columns: 72px 48px 1fr;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
      }
      .log-line:last-child {
        border-bottom: none;
      }
      .log-at {
        color: var(--muted);
      }
      .log-lvl {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.65rem;
        letter-spacing: 0.04em;
      }
      .log-lvl.info {
        color: var(--info);
      }
      .log-lvl.warn {
        color: var(--warn);
      }
      .log-lvl.error {
        color: var(--danger);
      }
      .log-msg {
        color: var(--ink);
      }
      .log-extra {
        margin-top: 4px;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hint {
        color: var(--muted);
        font-size: 0.72rem;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Exora push dashboard</h1>
      <p class="sub">상태 · 수동 폴링 · 상세 로그</p>

      <div class="row">
        <button id="runBtn" type="button">Run push poll now</button>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
        <span class="pill">
          <span id="statusDot" class="dot"></span>
          <span id="statusLabel">idle</span>
        </span>
      </div>

      <section>
        <h2>Poller status</h2>
        <div class="meta" id="meta"></div>
      </section>

      <section>
        <h2>Why no push?</h2>
        <div id="explain" class="explain">—</div>
      </section>

      <section>
        <h2>
          <span>Process log</span>
          <span id="logCount" style="font-weight: 400; text-transform: none; letter-spacing: 0"></span>
        </h2>
        <div id="logView" class="log-view">
          <div class="hint">No log yet.</div>
        </div>
        <p class="hint">
          Tip: <code>newCount=0</code> means everything is already in the seen DB — FCM will not fire until a truly new announcement appears.
        </p>
      </section>

      <section>
        <h2>Last result (JSON)</h2>
        <pre id="result">—</pre>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const runBtn = $('runBtn');
      const refreshBtn = $('refreshBtn');
      const resultEl = $('result');
      const metaEl = $('meta');
      const statusDot = $('statusDot');
      const statusLabel = $('statusLabel');
      const logView = $('logView');
      const logCount = $('logCount');
      const explainEl = $('explain');

      function setBusy(busy, label) {
        runBtn.disabled = busy;
        refreshBtn.disabled = busy;
        statusLabel.textContent = label;
        statusDot.className = 'dot' + (busy ? ' warn' : '');
      }

      function fmt(v) {
        if (v === null || v === undefined) return '—';
        if (typeof v === 'boolean') return v ? 'yes' : 'no';
        return String(v);
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function timeOnly(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(11, 19) || iso;
        return d.toISOString().slice(11, 19);
      }

      function renderLog(entries) {
        const list = Array.isArray(entries) ? entries : [];
        logCount.textContent = list.length ? `${list.length} lines` : '';
        if (!list.length) {
          logView.innerHTML = '<div class="hint">No log yet.</div>';
          return;
        }
        logView.innerHTML = list
          .map((e) => {
            const lvl = e.level || 'info';
            const extra =
              e.extra === undefined
                ? ''
                : `<div class="log-extra">${esc(
                    typeof e.extra === 'string'
                      ? e.extra
                      : JSON.stringify(e.extra, null, 2),
                  )}</div>`;
            return `<div class="log-line">
              <div class="log-at">${esc(timeOnly(e.at))}</div>
              <div class="log-lvl ${esc(lvl)}">${esc(lvl)}</div>
              <div class="log-msg">${esc(e.message || '')}${extra}</div>
            </div>`;
          })
          .join('');
        logView.scrollTop = logView.scrollHeight;
      }

      function explainFrom(last) {
        if (!last) return 'No tick yet.';
        if (last.explanation) return last.explanation;
        if (last.coldStart) {
          return 'Cold start: seeded seen DB only — no FCM on first empty-DB poll.';
        }
        if (last.ok === false) return last.error || 'Tick failed.';
        if ((last.newCount ?? 0) === 0) {
          return 'No new announcements vs seen DB → nothing to send.';
        }
        if ((last.sent ?? 0) > 0) return `Sent ${last.sent} push(es).`;
        return 'See process log for details.';
      }

      function renderStatus(data, preferResult) {
        const s = data.pushPoller || data;
        const last = preferResult || s.lastResult;
        const cells = [
          ['seen', s.seenCount],
          ['ticks', s.tickCount],
          ['interval', s.intervalMs != null ? `${s.intervalMs}ms` : null],
          ['dryRun', s.dryRun],
          ['credentials', s.hasCredentials],
          ['db', s.dbPath],
        ];
        metaEl.innerHTML = cells
          .map(
            ([k, v]) =>
              `<div><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`,
          )
          .join('');

        explainEl.textContent = explainFrom(last);

        const logEntries = preferResult?.log || s.log || last?.log || [];
        renderLog(logEntries);

        if (last) {
          const { log: _omit, ...rest } = last;
          resultEl.textContent = JSON.stringify(rest, null, 2);
          statusDot.className =
            'dot ' + (last.ok === false ? 'bad' : 'ok');
          statusLabel.textContent = last.coldStart
            ? 'last: cold start'
            : `last: new=${last.newCount ?? 0} sent=${last.sent ?? 0}`;
        } else {
          resultEl.textContent = '— (no tick yet)';
          statusDot.className = 'dot';
          statusLabel.textContent = 'no tick yet';
        }
      }

      async function loadStatus() {
        setBusy(true, 'loading…');
        try {
          const res = await fetch('/api/push-poller', { cache: 'no-store' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          renderStatus(data);
        } catch (err) {
          statusDot.className = 'dot bad';
          statusLabel.textContent = 'error';
          explainEl.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
          resultEl.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
        } finally {
          runBtn.disabled = false;
          refreshBtn.disabled = false;
        }
      }

      async function runPoll() {
        setBusy(true, 'polling…');
        explainEl.textContent = 'Running tick…';
        resultEl.textContent = 'Running tick…';
        try {
          const res = await fetch('/api/push-poller', {
            method: 'POST',
            cache: 'no-store',
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);

          const st = await fetch('/api/push-poller', { cache: 'no-store' });
          const status = await st.json();
          // Prefer POST body (includes this tick's log) + fresh meta counts.
          renderStatus(
            {
              ...status,
              log: data.log || status.log,
              lastResult: data,
            },
            data,
          );
        } catch (err) {
          statusDot.className = 'dot bad';
          statusLabel.textContent = 'error';
          explainEl.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
          resultEl.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
        } finally {
          runBtn.disabled = false;
          refreshBtn.disabled = false;
        }
      }

      runBtn.addEventListener('click', runPoll);
      refreshBtn.addEventListener('click', loadStatus);
      loadStatus();
    </script>
  </body>
</html>
