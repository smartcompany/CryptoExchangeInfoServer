# Cloudflare Workers — same Git repo as Vercel; separate runtime entry.
# Dashboard: Workers (not Pages). Root directory: server
# Deploy command: npx wrangler deploy

name = "exora-api"
main = "workers/index.js"
compatibility_date = "2025-11-01"
workers_dev = true

# Non-secret defaults (override in dashboard / wrangler.toml [vars] per env).
# Secrets (set via `wrangler secret put` or CF dashboard):
#   GEMINI_API_KEY
#   EXORA_API_TOKEN
# Optional secrets/vars:
#   DOWNLOAD_URL, IOS_INITIAL_AD, IOS_REWARDED_AD,
#   ANDROID_INITIAL_AD, ANDROID_REWARDED_AD

[vars]
DOWNLOAD_URL = "https://cryptoexchangeinfoserver.vercel.app/applink"
